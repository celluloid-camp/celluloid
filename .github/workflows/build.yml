name: Docker Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build-containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/celluloid-web
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.description=Celluloid
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Docker meta (db migrate)
        id: meta-db-migrate
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/celluloid-db-migrate
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=celluloid-web-staging
          cache-to: type=gha,mode=max,scope=celluloid-web-staging
          build-args: |
            VERSION=staging
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
            NEXT_PUBLIC_STAGE=staging

      - name: Build and push db migrate container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/db/Dockerfile
          push: true
          tags: ${{ steps.meta-db-migrate.outputs.tags }}
          labels: ${{ steps.meta-db-migrate.outputs.labels }}
          cache-from: type=gha,scope=celluloid-db-migrate-staging
          cache-to: type=gha,mode=max,scope=celluloid-db-migrate-staging
          build-args: |
            VERSION=staging
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
