apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: celluloid-production
resources:
  - ../../base
  - secrets.yml
  - ingress.yaml
  - namespace.yaml
images:
  - name: ghcr.io/celluloid-camp/celluloid/celluloid-web
    newTag: "3.12"
  - name: ghcr.io/celluloid-camp/celluloid/celluloid-db-migrate
    newTag: "3.12"
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          keel.sh/policy: minor
          keel.sh/initContainers: "true"
          keel.sh/trigger: poll
          keel.sh/pollSchedule: "@every 5m"
