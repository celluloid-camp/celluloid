# yaml-language-server: $schema=https://loccy.dev/schemas/config.schema.json

# Single config for Loccy i18n tools
# https://loccy.dev

modules:
  default:
    framework: next-intl
    translations:
      glob: 'apps/web/locales/**/*.json'
    usages:
      include:
        - '**/*.{js,ts,jsx,tsx}'

