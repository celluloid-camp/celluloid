name: E2E Tests

# Add concurrency group to cancel previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [staging]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "e2e/**"
      - "compose.ci.yml"
      - "playwright.config.ts"
      - ".github/workflows/test-ci.yml"
  workflow_dispatch:

jobs:
  tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: oven-sh/setup-bun@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium firefox

      - name: Install Playwright test dependency
        run: bun install @playwright/test

      - name: Start services with Docker Compose (wait for healthchecks)
        run: docker compose -f compose.ci.yml up -d --wait

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f compose.ci.yml logs --no-color

      - name: Smoke-check web responds
        run: |
          curl -sfS http://127.0.0.1:3000/api/health
          curl -sfS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3000/signup | tee /tmp/signup-status.txt
          test "$(cat /tmp/signup-status.txt)" = "200"

      - name: Run Playwright tests
        env:
          CI: true
          CI_TEST: true
          E2E: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: bun --env-file=apps/web/.env.ci playwright test

      - name: Dump web logs after tests
        if: failure()
        run: docker compose -f compose.ci.yml logs web --no-color | tail -n 200

      - name: Stop services
        if: always()
        run: |
          docker compose -f compose.ci.yml down -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 5

      - name: Comment PR with test results
        uses: dorny/test-reporter@v1
        if: always() && github.event_name == 'pull_request'
        with:
          name: Playwright E2E Tests
          path: test-results/junit.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          max-annotations: 50
          fail-on-error: true
          only-summary: false
